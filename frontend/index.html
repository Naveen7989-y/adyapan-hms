<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/adyapan-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adyapan Hospital Queue & Appointment System</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('adyapan_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F1E7] dark:bg-[#070D18] text-[#14243A] dark:text-[#F8FAFC] antialiased font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
