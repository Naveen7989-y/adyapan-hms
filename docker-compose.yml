version: '3.8'

services:
  # ============================================================
  # 1. PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-adyapan_hms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-adyapan_hms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  # ============================================================
  # 2. Redis In-Memory Store (Cache & Queue Ready)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: hms-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hms-network

  # ============================================================
  # 3. Backend API Service (Node.js + Express + Prisma)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-adyapan_hms}?schema=public
      JWT_SECRET: ${JWT_SECRET:-adyapan_jwt_super_secret_production_key_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-adyapan_jwt_refresh_super_secret_production_key_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://localhost:80,http://localhost:5173}
      REDIS_URL: redis://redis:6379
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hms-network

  # ============================================================
  # 4. Frontend Web Client (React Vite + Nginx Reverse Proxy)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: hms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hms-network

# ============================================================
# Persistent Data Volumes & Isolated Network
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hms-network:
    driver: bridge
